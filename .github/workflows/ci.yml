# Deploy-equivalent check: ensures main app build passes (Vercel uses same build).
# Hardened per npm-supply-chain-defense skill.
# - permissions: read-all at workflow level (escalate per job only if needed)
# - npm ci uses --ignore-scripts and --allow-git=none
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts --allow-git=none
      - run: npm run build
